{% extends "base.html" %}
{% block content %}

<h1>All Images</h1>

<div id="top_block">
  <ul id="quad">
    {% for image in images %}
      <li>
        <a href="/images/{{ image.id }}">
          <img src="/assets/images/thumbnails/{{ image.location }}" class="browse_top_block_image" alt="{{ image.name }}" />
        </a>
      </li>
    {% endfor %}
  </ul>
</div>

<div class="bottomCenter">
  <a href="/images/new">New Image</a>
</div>

{% endblock content %}
