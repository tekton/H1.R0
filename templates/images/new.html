{% extends "base.html" %}
{% block content %}

<h1>New Image</h1>

{% if error %}
  <div id="error_explanation"><p>{{ error }}</p></div>
{% endif %}

<form method="post" action="/images">
  <div class="field">
    <label>Location</label><br />
    <input type="text" name="location" value="" />
  </div>
  <div class="field">
    <label>Name</label><br />
    <input type="text" name="name" value="" />
  </div>
  <div class="actions">
    <input type="submit" value="Create Image" />
  </div>
</form>

<a href="/images">Back</a>

{% endblock content %}
