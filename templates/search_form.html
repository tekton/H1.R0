{{define "search_form"}}
{{range .Errors}}
<div id="error_explanation">
  <p>{{.}}</p>
</div>
{{end}}

<form action="{{.Action}}" method="POST">
  {{if eq .Method "PUT"}}
  <input type="hidden" name="_method" value="PUT">
  {{end}}

  <div class="field">
    <label for="md5hash">Hash</label><br>
    <input type="text" id="md5hash" name="md5hash" value="{{.Search.Md5hash}}">
  </div>

  <div class="field">
    <label for="serial">Serial (JSON)</label><br>
    <input type="text" id="serial" name="serial" value="{{.Search.Serial}}">
  </div>

  <div class="actions">
    <input type="submit" value="Save Search">
  </div>
</form>
{{end}}
